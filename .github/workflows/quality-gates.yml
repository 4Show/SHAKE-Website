name: Website quality gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and CSS presence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          files=list(Path('website-content/HTML').glob('*.html'))
          assert files, 'No HTML files found'
          assert list(Path('website-content/CSS').glob('*.css')), 'No CSS files found'
          for f in files:
              HTMLParser().feed(f.read_text(encoding='utf-8'))
              print('Parsed:', f)
          PY
      - name: Check for merge conflict markers
        run: |
          if grep -RnE '^(<<<<<<< |=======|>>>>>>> )' website-content --include='*.html' --include='*.css' --include='*.js'; then exit 1; fi
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive shake-aws-iac
