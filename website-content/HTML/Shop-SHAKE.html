  <style> 
    .product-scroll {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: auto;
      align-items: stretch;
      justify-items: center;
      width: 90%;
    }
    
    .product-item {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        width: 100%;
        box-sizing: border-box;
        padding: 5%;
    }

    .pictureContainer {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        width: 100%;
        height: auto;
        justify-content: center;
        text-align: center;
    }

    .pictureContainer > img {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        border-radius: 5px;
        object-fit: contain;
    }
    
    .product-details {
        flex: 0 0 auto;
        margin-top: 10px;
        text-align: center;
        width: 100%;
        padding-left: 0%; /* Add padding to the left of product details */
        overflow-wrap: break-word;
    }

    .product-details h3 {
        min-height: 2.4em;
        line-height: 1.2;
    }

    .color-selection {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    
    .price {
        color: #e84946;
    }
    
    .add-to-cart {
        background-color: #e84946;
        color: #fff;
        padding: 5px 10px;
        border: 1px solid transparent;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 650;
        letter-spacing: .025em;
        transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .button-group {
        display: flex;
        margin-top: 10px;
        margin-bottom: 10px;
        align-items: right;
        justify-content: center;
      }
        @media screen and (max-width: 1130px)
        {
          html{
            font-size: 12px;
          }
          .product-scroll {
            width: 100%;
          }
          .pictureContainer > img {
            max-width: 100%;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            object-fit: contain;
          }

          .product-item{
            width: 100%;

          }

          .product-details
          {
            width:100%;
            height:auto;
          }

          .pictureContainer
          {
            width:100%;
            height:auto;
          }


        }
    
    </style>
</head>
